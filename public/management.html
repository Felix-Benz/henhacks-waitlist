<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Waitlist</title>
    <link rel="stylesheet" href="managestyles.css">


    <style>
        table {
            width: 100%;
            border-collapse: collapse;

        }
        th, td {
            border: 1px solid rgb(0, 0, 0);
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #ffffff;
            color: black;
        }
    </style>
</head>
<body>

    <h1>Patient Waitlist</h1>
    <button onclick="fetchPatients()">Refresh List</button>

    <table id="patientsTable">
        <thead>
            <tr>
                <th>Rank</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Urgency Level</th>
                <th>AI Rationale</th>
                <th>Symptoms</th>
                <th>Timestamp</th>
                <th>Override</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="patientsBody">
            <!-- Patients data will be inserted here -->
        </tbody>
    </table>

    <script>
        async function fetchPatients() {
            try {
                const response = await fetch("/getPatients", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({})
                });

                const data = await response.json();

                if (data.error) {
                    document.getElementById("patientsBody").innerHTML = `<tr><td colspan="9">${escapeHtml(data.error)}</td></tr>`;
                    return;
                }

                const tableBody = document.getElementById("patientsBody");
                tableBody.innerHTML = ""; // Clear previous entries

                data.forEach(patient => {
                    const reviewBadge = patient.needs_review
                        ? `<div class="badge review-badge">Needs review: ${escapeHtml(patient.review_reason)}</div>`
                        : "";
                    const overrideBadge = patient.severity_overridden
                        ? `<div class="badge override-badge">Staff override (AI: ${escapeHtml(patient.ai_severity ?? "none")})</div>`
                        : "";
                    const row = `<tr class="${patient.needs_review ? "needs-review" : ""}">
                        <td>${escapeHtml(patient.rank)}</td>
                        <td>${escapeHtml(patient.first_name)}</td>
                        <td>${escapeHtml(patient.last_name)}</td>
                        <td>${escapeHtml(patient.pain_level ?? "—")}${reviewBadge}${overrideBadge}</td>
                        <td>${escapeHtml(patient.severity_rationale ?? "")}</td>
                        <td>${escapeHtml(patient.symptoms)}</td>
                        <td>${escapeHtml(patient.timestamp)}</td>
                        <td class="override-cell">
                            <input type="number" min="1" max="100" step="1" id="override-${patient.id}" value="${escapeHtml(patient.pain_level ?? "")}">
                            <button class="override-btn" onclick="overrideSeverity(${patient.id})">Set</button>
                        </td>
                        <td><button class="remove-btn" onclick="removePatient(${patient.id})">❌</button></td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });

            } catch (error) {
                console.error("Error fetching patients:", error);
                document.getElementById("patientsBody").innerHTML = `<tr><td colspan="9">Error loading data.</td></tr>`;
            }
        }

        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = String(value);
            return div.innerHTML.replace(/"/g, "&quot;");
        }

        async function overrideSeverity(patientId) {
            const severity = Number(document.getElementById(`override-${patientId}`).value);
            if (!Number.isInteger(severity) || severity < 1 || severity > 100) {
                alert("Severity must be a whole number from 1 to 100.");
                return;
            }

            try {
                const response = await fetch(`/overrideSeverity/${patientId}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ severity })
                });

                const data = await response.json();
                if (data.success) {
                    fetchPatients(); // Refresh the list
                } else {
                    alert(data.error || "Error updating severity.");
                }
            } catch (error) {
                console.error("Error updating severity:", error);
                alert("Failed to update severity.");
            }
        }

        async function removePatient(patientId) {
        if (!confirm("Are you sure you want to remove this patient?")) return;

        try {
            const response = await fetch(`/removePatient/${patientId}`, {
                method: "DELETE",
            });

            const data = await response.json();
            if (data.success) {
                alert("Patient removed successfully!");
                fetchPatients(); // Refresh the list
            } else {
                alert("Error removing patient.");
            }
        } catch (error) {
            console.error("Error removing patient:", error);
            alert("Failed to remove patient.");
        }
    }

        // Fetch patients when the page loads
        window.onload = fetchPatients;
    </script>

</body>
</html>
